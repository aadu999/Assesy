<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafb;
        }

        .glass-card {
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body class="min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-bold text-slate-800">Technical Assessment</h1>
            <p class="text-slate-500 mt-2">Please answer the following questions before proceeding to the coding
                challenge.</p>
        </header>

        <form id="assessmentForm" class="space-y-8">
            <div id="questionsContainer" class="space-y-6">
                <!-- Questions will be injected here -->
                <div class="text-center py-10">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="mt-4 text-slate-500">Loading questions...</p>
                </div>
            </div>

            <div class="flex justify-end pt-6">
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-xl transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                    id="submitBtn">
                    Submit Answers
                </button>
            </div>
        </form>

        <div id="codingSection" class="hidden mt-10 text-center glass-card p-10 rounded-2xl">
            <div class="mb-6">
                <div
                    class="h-16 w-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                    ✓</div>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Answers Submitted!</h2>
            <p class="text-slate-600 mb-8">You are now ready to start the coding challenge.</p>
            <button id="startCodingBtn"
                class="bg-slate-800 hover:bg-slate-900 text-white font-semibold py-4 px-10 rounded-xl transition shadow-lg w-full sm:w-auto">
                Start Coding Environment
            </button>
            <div id="provisioningStatus" class="hidden mt-6">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-slate-800 mx-auto mb-2"></div>
                <p class="text-slate-500 text-sm">Preparing your environment...</p>
            </div>
        </div>
    </div>

    <script>
        const token = window.location.pathname.split('/').pop();
        let questions = [];

        async function loadQuestions() {
            try {
                const res = await fetch(`/session/${token}/questions`);
                if (!res.ok) throw new Error('Failed to load questions');
                questions = await res.json();
                renderQuestions();
            } catch (error) {
                document.getElementById('questionsContainer').innerHTML = `
                    <div class="text-center text-red-500 py-10">
                        Failed to load questions. Please refresh the page.
                    </div>
                `;
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-500">
                        No questions found for this section. You can proceed to coding.
                    </div>
                `;
                document.getElementById('assessmentForm').classList.add('hidden');
                document.getElementById('codingSection').classList.remove('hidden');
                document.querySelector('#codingSection h2').textContent = 'Ready to Code';
                document.querySelector('#codingSection p').textContent = 'Click below to start your coding session.';
                return;
            }

            container.innerHTML = questions.map((q, index) => `
                <div class="glass-card p-6 rounded-2xl" data-id="${q.id}">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full">Question ${index + 1}</span>
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">${q.type.replace(/_/g, ' ')}</span>
                    </div>
                    <p class="text-lg text-slate-800 font-medium mb-6">${q.question_text}</p>
                    
                    ${q.type === 'MCQ' ? `
                        <div class="space-y-3">
                            ${(Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]')).map((opt, i) => `
                                <label class="flex items-center p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition group">
                                    <input type="radio" name="q_${q.id}" value="${opt}" class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500">
                                    <span class="ml-3 text-slate-700 group-hover:text-slate-900">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    ` : `
                        <div>
                            <input type="text" name="q_${q.id}" placeholder="Type your answer here..." 
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
                        </div>
                    `}
                </div>
            `).join('');
        }

        document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const answers = questions.map(q => {
                let response = '';
                if (q.type === 'MCQ') {
                    const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
                    response = selected ? selected.value : '';
                } else {
                    response = document.querySelector(`input[name="q_${q.id}"]`).value;
                }
                return { questionId: q.id, response };
            });

            try {
                const res = await fetch(`/session/${token}/answers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });

                if (res.ok) {
                    document.getElementById('assessmentForm').classList.add('hidden');
                    document.getElementById('codingSection').classList.remove('hidden');
                } else {
                    alert('Failed to submit answers. Please try again.');
                    btn.disabled = false;
                    btn.textContent = 'Submit Answers';
                }
            } catch (error) {
                console.error(error);
                alert('Error submitting answers.');
                btn.disabled = false;
                btn.textContent = 'Submit Answers';
            }
        });

        document.getElementById('startCodingBtn').addEventListener('click', async () => {
            const btn = document.getElementById('startCodingBtn');
            const status = document.getElementById('provisioningStatus');

            btn.classList.add('hidden');
            status.classList.remove('hidden');

            const poll = async () => {
                try {
                    const res = await fetch(`/session/${token}/start-coding`, { method: 'POST' });
                    const data = await res.json();

                    if (data.url) {
                        window.location.href = data.url;
                    } else if (data.status === 'PROVISIONING') {
                        setTimeout(poll, 3000);
                    } else {
                        alert('Something went wrong. Please refresh.');
                    }
                } catch (error) {
                    console.error(error);
                }
            };

            poll();
        });

        loadQuestions();
    </script>
</body>

</html>
